<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labo maths</title>
  <meta name="description" content="Outils interactifs pour comprendre les mathématiques en les manipulant.">
  <link rel="stylesheet" href="shared/theme.css">
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <h1>Labo maths</h1>
    <button id="theme-toggle" class="ghost" type="button" aria-label="Changer de thème">Thème</button>
  </header>

  <main class="home">
    <p class="intro">Des outils interactifs pour comprendre les mathématiques en les manipulant :
      on fait varier les paramètres et on voit tout de suite l'effet sur la courbe.</p>

    <!-- One <li> per tool. Each tool lives in its own folder and reuses shared/. -->
    <ul class="tools">
      <li>
        <a class="panel tool-card" href="sinusoides/">
          <svg viewBox="0 0 200 72" aria-hidden="true">
            <line x1="0" y1="36" x2="200" y2="36" stroke="var(--midline)" stroke-dasharray="4 4"/>
            <path d="M0 36 C 16 4, 34 4, 50 36 S 84 68, 100 36 S 134 4, 150 36 S 184 68, 200 36"
                  fill="none" stroke="var(--curve)" stroke-width="2.5"/>
          </svg>
          <h2>Fonctions sinusoïdales</h2>
          <p><span class="tex">y = A·sin(ωx − φ) + D</span> : curseurs, saisie libre
            et ajustement automatique d'une sinusoïde.</p>
        </a>
      </li>
    </ul>
  </main>

  <script type="module">
    import { initTheme } from "./shared/theme.js";
    initTheme(document.getElementById("theme-toggle"));
  </script>
</body>
</html>
